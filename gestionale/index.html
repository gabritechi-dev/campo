<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!-- APP:START -->
<title>TEMPRA Gestionale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --lama:#111113; --pietra:#EEE8E2; --forgia:#E5502A; --acciaio:#2F3B45; --cenere:#8C8782; --sabbia:#D9D2CA;
  --bg:#EEE8E2; --surface:#F7F3EE; --surface-2:#E7E1DA; --line:#D9D2CA; --line-strong:#BDB4AA;
  --ink:#111113; --ink-2:#45423F; --muted:#6C6762;
  --accent:#E5502A; --accent-ink:#B0381A; --on-accent:#111113;
  --steel:#2F3B45; --steel-soft:#DCE1E5;
  --good:#1F6B45; --good-bg:#DAEADF; --warn:#7F5300; --warn-bg:#F2E2BE; --bad:#A01C2E; --bad-bg:#F5D7D8;
  --bar-cost:#2F3B45; --bar-tax:#A39C94; --bar-profit:#E5502A;
  --head-bg:#111113; --head-ink:#EEE8E2; --head-muted:#8C8782;
  --shadow:0 18px 50px rgba(17,17,19,.22);
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111113; --surface:#1A1A1D; --surface-2:#232327; --line:#2C2C32; --line-strong:#43434B;
    --ink:#EEE8E2; --ink-2:#BDB6AE; --muted:#8C8782;
    --accent:#E5502A; --accent-ink:#F27A55; --on-accent:#111113;
    --steel:#8FA3B5; --steel-soft:#2A333B;
    --good:#6FCB94; --good-bg:#17301F; --warn:#E9B458; --warn-bg:#352A12; --bad:#F27D86; --bad-bg:#3A1519;
    --bar-cost:#5E7385; --bar-tax:#6B6661; --bar-profit:#E5502A;
    --head-bg:#0A0A0B; --head-ink:#EEE8E2; --head-muted:#8C8782;
    --shadow:0 18px 50px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111113; --surface:#1A1A1D; --surface-2:#232327; --line:#2C2C32; --line-strong:#43434B;
  --ink:#EEE8E2; --ink-2:#BDB6AE; --muted:#8C8782;
  --accent:#E5502A; --accent-ink:#F27A55; --on-accent:#111113;
  --steel:#8FA3B5; --steel-soft:#2A333B;
  --good:#6FCB94; --good-bg:#17301F; --warn:#E9B458; --warn-bg:#352A12; --bad:#F27D86; --bad-bg:#3A1519;
  --bar-cost:#5E7385; --bar-tax:#6B6661; --bar-profit:#E5502A;
  --head-bg:#0A0A0B; --head-ink:#EEE8E2; --head-muted:#8C8782;
  --shadow:0 18px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-ink);margin:0}
.muted{color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-ink);border-bottom:1px solid #26262b}
.top-row{display:flex;align-items:center;gap:14px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.lama{width:30px;height:auto;fill:var(--forgia);flex:none}
.wordmark{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:.28em}
.brand-sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--head-muted);border-left:1px solid #34343a;padding-left:12px}
.store-chip{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--head-muted);white-space:nowrap}
.store-chip i{width:8px;height:8px;border-radius:50%;background:var(--cenere);display:block}
.store-chip.cloud i{background:#6FCB94}
.store-chip.err i{background:#F27D86}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--head-muted);padding:10px 14px 12px;font-family:var(--f-display);font-weight:500;font-size:14px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;position:relative}
.tab:hover{color:var(--head-ink)}
.tab[aria-current="page"]{color:var(--head-ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:4px;background:var(--forgia);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
@media (max-width:560px){.brand-sub{display:none}.wordmark{font-size:17px}.store-chip span{display:none}.sh-foot .btn.ghost[data-close]{display:none}}

main{padding-block:26px 80px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;margin-bottom:20px}
.view-head h1{font-size:clamp(28px,4vw,40px);margin-top:4px}
.view-head p.lead{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:3px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.forgia{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line-strong)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:3px;cursor:pointer;display:inline-grid;place-items:center;flex:none;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--ink);color:var(--ink)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 18px 10px}
.panel-head h2{font-size:19px}
.panel-body{padding:0 18px 18px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.kpi.dark{background:var(--head-bg);border-color:var(--head-bg);color:var(--head-ink)}
.kpi.dark .kpi-label,.kpi.dark .kpi-sub{color:var(--head-muted)}
.kpi-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:13px;color:var(--muted)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:2px;white-space:nowrap;font-weight:700}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.grade{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;padding:3px 7px;border-radius:2px;font-weight:700;display:inline-block}
.grade.BASE{background:var(--sabbia);color:#111113}
.grade.PRO{background:#2F3B45;color:#EEE8E2}
.grade.ELITE{background:#111113;color:#E5502A;box-shadow:inset 0 0 0 1px #3a3a40}
.st{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:3px 8px;border-radius:2px;white-space:nowrap;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.st.Preventivo{background:var(--steel-soft);color:var(--steel)}
.st.Confermato,.st.In-produzione{background:var(--warn-bg);color:var(--warn)}
.st.Spedito,.st.Consegnato{background:var(--good-bg);color:var(--good)}
.st.Annullato{background:var(--surface-2);color:var(--muted);text-decoration:line-through}

/* Banners */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-radius:4px;margin-bottom:18px;background:var(--surface);border:1px solid var(--line)}
.banner.sample{border-left:4px solid var(--accent)}
.banner p{margin:0;flex:1 1 280px;color:var(--ink-2);font-size:14px}
.banner strong{color:var(--ink)}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{flex:1 1 220px;max-width:360px;border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;padding:8px 12px}

/* Catalog */
.cat-block{margin-bottom:18px}
.cat-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0 8px;border-bottom:2px solid var(--ink)}
.cat-code{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--accent-ink);letter-spacing:.06em;min-width:48px}
.cat-name{font-family:var(--f-display);font-weight:600;font-size:18px}
.line-tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border-radius:2px}
.line-tag.calcio{background:#111113;color:#EEE8E2;box-shadow:inset 0 0 0 1px #3a3a40}
.line-tag.padel{background:#2F3B45;color:#EEE8E2}
.cat-head .count{font-size:13px;color:var(--muted)}
.cat-head .btn{margin-left:auto}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,2.6fr) 64px repeat(3,minmax(84px,1fr)) 96px 84px;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;appearance:none}
.row:hover{background:var(--surface)}
.row .r-name b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-name small{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-num{text-align:right;font-size:13.5px}
.row .r-num small{display:none;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row-labels{display:grid;grid-template-columns:minmax(0,2.6fr) 64px repeat(3,minmax(84px,1fr)) 96px 84px;gap:12px;padding:8px 8px 6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row-labels span:nth-child(n+3){text-align:right}
.empty-row{padding:14px 8px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.low{color:var(--bad);font-weight:700}
@media (max-width:760px){
  .row-labels{display:none}
  .row{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
  .row .r-name{grid-column:1 / 3}
  .row .r-grade{grid-column:3 / 4;justify-self:end}
  .row .r-num{text-align:left}
  .row .r-num small{display:block}
}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-mono);font-size:10.5px;padding:2px 6px;border:1px solid var(--line-strong);border-radius:2px;color:var(--ink-2);white-space:nowrap}

/* Margin meters */
.meter-list{display:flex;flex-direction:column}
.meter{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(80px,1.2fr) 62px 112px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.meter:last-child{border-bottom:0}
.meter .m-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.meter .m-name small{font-family:var(--f-mono);color:var(--muted);font-size:11px;margin-right:6px}
.track{position:relative;height:10px;background:var(--surface-2);border-radius:2px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar-cost);border-radius:0 4px 4px 0}
.track .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent)}
.meter .m-val{text-align:right;font-size:13px}
.meter .pill{justify-self:end}
@media (max-width:520px){.meter{grid-template-columns:minmax(0,1fr) 62px 112px}.meter .track{grid-column:1 / -1;grid-row:2}}
.legend-inline{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend-inline i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow small{display:block;color:var(--muted);font-size:12.5px}

/* Cards (suppliers) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;appearance:none;width:100%}
.card:hover{border-color:var(--ink)}
.card h3{font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50}
.sheet-back{position:absolute;inset:0;background:rgba(10,10,11,.55)}
.sheet-panel{position:absolute;top:0;right:0;bottom:0;width:min(1120px,100%);background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-head{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.sh-head h2{font-size:24px;margin-top:4px}
.sh-head .icon-btn{margin-left:auto}
.sh-body{flex:1;overflow-y:auto;padding:20px}
.sh-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface)}
.sh-foot .spacer{flex:1}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.ed-sum{position:sticky;top:0}
@media (max-width:900px){.ed-grid{grid-template-columns:minmax(0,1fr)}.ed-sum{position:static;order:-1}}
fieldset{border:1px solid var(--line);border-radius:4px;background:var(--surface);margin:0 0 16px;padding:14px 16px 16px}
legend{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);padding:0 6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px 14px}
.fgrid .span2{grid-column:span 2}
.fgrid .full{grid-column:1 / -1}
@media (max-width:420px){.fgrid .span2{grid-column:1 / -1}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fld .hint{font-size:12px;color:var(--muted)}
.inp{display:flex;align-items:center;border:1px solid var(--line-strong);background:var(--bg);border-radius:3px;min-width:0}
.inp:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;background:transparent;padding:8px 10px;outline:none}
.inp textarea{min-height:74px;resize:vertical}
.inp .affix{padding:0 10px;color:var(--muted);font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.inp select{appearance:auto}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:var(--bg);cursor:pointer;font-size:13.5px}
.check input{margin-top:3px;accent-color:var(--accent)}
.check small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.check:has(input:checked){border-color:var(--ink)}

/* Price summary */
.sum{background:var(--head-bg);color:var(--head-ink);border-radius:4px;padding:18px}
.sum .eyebrow{color:#F27A55}
.sum-big{font-family:var(--f-display);font-size:34px;font-weight:600;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.sum-big small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--head-muted);margin-left:6px}
.compbar{display:flex;gap:2px;height:14px;margin:14px 0 8px}
.compbar span{display:block;height:100%}
.compbar span:first-child{border-radius:2px 0 0 2px}
.compbar span:last-child{border-radius:0 4px 4px 0}
.seg-cost{background:#5E7385}
.seg-tax{background:repeating-linear-gradient(135deg,#8C8782 0 3px,#5b5753 3px 6px)}
.seg-profit{background:#E5502A}
.sum .legend-inline{color:var(--head-muted)}
.sum dl{margin:14px 0 0;display:grid;grid-template-columns:1fr auto;gap:0}
.sum dt,.sum dd{padding:6px 0;border-bottom:1px solid #2a2a30;margin:0;font-size:13.5px}
.sum dt{color:#BDB6AE}
.sum dd{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sum dt.tot,.sum dd.tot{color:#EEE8E2;font-weight:700;border-bottom-color:#4a4a52}
.sum dd.pos{color:#8FDCAD}.sum dd.neg{color:#FF8E96}
.sum .sub-h{grid-column:1 / -1;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8C8782;padding:14px 0 2px;border:0}

const pct = x => Number.isFinite(x) ? (x*100).toFixed(1).replace('.',',') + '%' : '—';
const dec = (x,d=2) => Number.isFinite(x) ? x.toFixed(d).replace('.',',') : '';
const n = v => { const x = parseFloat(String(v ?? '').replace(',','.')); return Number.isFinite(x) ? x : 0; };

const catOf = id => allCats().find(c => c.id === id) || {id, code:'—', name:'Senza categoria', line:'calcio'};
const psych = x => Number.isFinite(x) && x > 0 ? Math.ceil(x + 0.1) - 0.1 : NaN;
const fmtDate = d => { if(!d) return '—'; const [y,m,g] = d.split('-'); return `${g}/${m}/${y}`; };

/* ---------- Calcoli ---------- */
function unitCost(p){
  const lot = Math.max(1, n(p.lotQty) || 1);
  const purchase = n(p.cost);
  const freight = n(p.lotShip) / lot;
  const duties = purchase * n(p.duties) / 100;
  const pack = n(p.packaging);
  let cust = 0, setup = 0;
  (p.baseCustoms || []).forEach(id => { const c = byId('customs', id); if(c){ cust += n(c.cost); setup += n(c.setup) / lot; } });
  const total = purchase + freight + duties + pack + cust + setup;
  return {purchase, freight, duties, pack, cust: cust + setup, total, lot};
}
function priceCalc(p, price = n(p.price)){
  const st = S.settings, v = n(st.iva)/100, f = n(st.feePct)/100, F = n(st.feeFixed);
  const uc = unitCost(p);
  const net = price / (1 + v);
  const vat = price - net;
  const fees = price > 0 ? price * f + F : 0;
  const profit = net - uc.total - fees;
  const margin = net > 0 ? profit / net : NaN;
  const markup = uc.total > 0 ? net / uc.total : NaN;
  const m = n(st.targetMargin)/100;
  const denom = (1 - m) / (1 + v) - f;
  const suggested = denom > 0 ? psych((uc.total + F) / denom) : NaN;
  const ship = byId('shipping', p.shipId);
  const shipCost = ship ? n(ship.cost) : 0;
  const shipNet = ship ? n(ship.price) / (1 + v) : 0;
  return {uc, price, net, vat, fees, profit, margin, markup, suggested, ship, shipCost,
    profitFreeShip: profit - shipCost, profitPaidShip: profit + shipNet - shipCost};
}
function status(c){
  if(!Number.isFinite(c.margin) || c.price <= 0) return {cls:'neutral', label:'Senza prezzo'};
  if(c.profit < 0) return {cls:'bad', label:'▼ In perdita'};
  if(c.margin < n(S.settings.targetMargin)/100) return {cls:'warn', label:'▲ Sotto target'};
  return {cls:'ok', label:'● In target'};
}
function soldQty(pid){
  let q = 0;
  S.orders.forEach(o => { if(SOLD.includes(o.status)) (o.items||[]).forEach(it => { if(it.pid === pid) q += n(it.qty); }); });
  return q;
}
function orderCalc(o){
  const st = S.settings, v = n(st.iva)/100, f = n(st.feePct)/100, F = n(st.feeFixed);
  let goods = 0, custGross = 0, goodsCost = 0, custCost = 0, pieces = 0;
  const lines = (o.items || []).map(it => {
    const p = byId('products', it.pid);
    const qty = n(it.qty), unit = n(it.price);
    let cg = 0, cc = 0, setup = 0;
    (it.customs || []).forEach(cid => { const c = byId('customs', cid); if(c){ cg += n(c.price); cc += n(c.cost); setup += n(c.setup); } });
    const lc = p ? unitCost(p).total : 0;
    const gross = qty * (unit + cg);
    const cost = qty * lc + qty * cc + setup;
    goods += qty * unit; custGross += qty * cg; goodsCost += qty * lc; custCost += qty * cc + setup; pieces += qty;
    return {gross, cost, qty, unitFull: unit + cg};
  });
  const sub = goods + custGross;
  const discount = sub * n(o.discountPct) / 100;
  const shipCharged = n(o.shipCharged);
  const rate = byId('shipping', o.shipId);
  const shipCost = rate ? n(rate.cost) * Math.max(1, n(o.parcels) || 1) : 0;
  const total = sub - discount + shipCharged;
  const net = total / (1 + v);
  const vat = total - net;
  const fees = total > 0 ? total * f + F : 0;
  const costs = goodsCost + custCost + shipCost + fees;
  const profit = net - goodsCost - custCost - shipCost;
  const profitAfterFees = profit - fees;
  return {lines, goods, custGross, sub, discount, shipCharged, shipCost, total, net, vat, fees, goodsCost, custCost, costs,
    profit: profitAfterFees, margin: net > 0 ? profitAfterFees / net : NaN, pieces};
}

/* ---------- Persistenza ---------- */
function setChip(kind, text){
  const c = $('#store-chip'); c.className = 'store-chip ' + kind; c.querySelector('span').textContent = text; c.title = text;
}
function persistLocal(){
  if(mode !== 'local') return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) { setChip('err','Salvataggio locale non disponibile'); }
}
function loadLocal(){
  let data = null;
  try { const raw = localStorage.getItem(LS_KEY); if(raw) data = JSON.parse(raw); } catch(e) {}
  if(!data) data = sampleData();
  S.settings = {...DEF_SETTINGS, ...(data.settings || {})};
  COLS.forEach(c => { S[c] = Array.isArray(data[c]) ? data[c] : []; });
  settingsExists = true;
}
const chains = new Map();
function queued(path, fn){
  const prev = chains.get(path) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  chains.set(path, next);
  return next;
}
function writeFailed(e){
  const code = e && e.code;
  if(code === 'invalid_argument'){ readOnly = true; toast('Non hai i permessi per modificare questi dati.'); render(); }
  else if(code === 'quota_exceeded'){ toast('Spazio dati esaurito: elimina modelli o ordini vecchi.'); }
  else toast('Salvataggio non riuscito. Controlla la connessione e riprova.');
}
function upsertLocal(col, obj){
  const i = S[col].findIndex(x => x.id === obj.id);
  if(i >= 0) S[col][i] = obj; else S[col].push(obj);
}
async function saveDoc(col, obj){
  const doc = clone(obj);
  upsertLocal(col, doc); render();
  if(mode === 'cloud'){
    try { await queued(col + '/' + doc.id, () => db.collection(col).doc(doc.id).set(doc)); return true; }
    catch(e){ writeFailed(e); return false; }
  }
  persistLocal(); return true;
}
async function deleteDoc(col, id){
  S[col] = S[col].filter(x => x.id !== id); render();
  if(mode === 'cloud'){
    try { await queued(col + '/' + id, () => db.collection(col).doc(id).delete()); }
    catch(e){ writeFailed(e); }
  } else persistLocal();
}
async function saveSettings(){
  const doc = clone(S.settings);
  if(mode === 'cloud'){
    settingsExists = true;
    try { await queued('config/settings', () => db.doc('config/settings').set(doc)); }
    catch(e){ writeFailed(e); }
  } else persistLocal();
}
async function writeAll(data){
  S.settings = {...DEF_SETTINGS, ...(data.settings || {})};
  await saveSettings();
  for(const c of COLS){
    for(const d of (data[c] || [])){
      if(!d || typeof d.id !== 'string' || !/^[A-Za-z0-9_.~:@+-]{1,120}$/.test(d.id)) continue;
      upsertLocal(c, d);
      if(mode === 'cloud'){
        try { await queued(c + '/' + d.id, () => db.collection(c).doc(d.id).set(d)); } catch(e){ writeFailed(e); return false; }
      }
    }
  }
  persistLocal(); render(); return true;
}

async function boot(){
  try { const v = localStorage.getItem('tempra-view'); if(v) view = v; } catch(e) {}
  const hash = location.hash.replace('#','');
  if(['dashboard','catalogo','personalizzazioni','ordini','fornitori','spedizioni','impostazioni'].includes(hash)) view = hash;
  renderTabs();
  if(window.claude && typeof window.claude.use === 'function'){
    try { db = await window.claude.use('db'); } catch(e){ db = null; }
  }
  if(db){
    mode = 'cloud'; setChip('', 'Collegamento…');
    const pending = new Set(COLS.concat('settings'));
    const ready = key => { if(pending.delete(key) && pending.size === 0){ loaded = true; setChip('cloud','Salvato nel cloud'); } if(!pending.size) render(); };
    const onErr = e => { setChip('err', 'Connessione dati persa'); if(e && e.code !== 'revoked') toast('Aggiornamento dati interrotto: ricarica la pagina.'); };
    COLS.forEach(c => {
      db.collection(c).onSnapshot(snap => {
        S[c] = snap.docs.map(d => ({...clone(d.data()), id: d.id}));
        ready(c);
      }, onErr);
    });
    db.doc('config/settings').onSnapshot(snap => {
      settingsExists = snap.exists;
      S.settings = {...DEF_SETTINGS, ...(snap.exists ? clone(snap.data()) : {})};
      const typing = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.set;
      if(typing && loaded){ return; }
      ready('settings');
    }, onErr);
  } else {
    mode = 'local'; loadLocal(); loaded = true;
    setChip('', 'Salvato su questo dispositivo');
    render();
  }
}

const VIEWS = [['dashboard','Dashboard'],['catalogo','Catalogo'],['personalizzazioni','Personalizzazioni'],['ordini','Ordini e preventivi'],['fornitori','Fornitori'],['spedizioni','Spedizioni'],['impostazioni','Impostazioni']];
function renderTabs(){
  $('#tabs').innerHTML = VIEWS.map(([k,l]) => `<button class="tab" data-view="${k}" ${k===view?'aria-current="page"':''}>${l}</button>`).join('');
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if(!b) return;
  view = b.dataset.view;
  try { localStorage.setItem('tempra-view', view); } catch(err) {}
  renderTabs(); render(); window.scrollTo({top:0});
});

function render(){
  if(!loaded){ return; }
  const main = $('#main');
  const fn = {dashboard:vDashboard, catalogo:vCatalog, personalizzazioni:vCustoms, ordini:vOrders, fornitori:vSuppliers, spedizioni:vShipping, impostazioni:vSettings}[view] || vDashboard;
  const a = document.activeElement;
  const fid = a && main.contains(a) && a.id ? a.id : null;
  let sel = null; try { sel = [a.selectionStart, a.selectionEnd]; } catch(e) {}
  main.innerHTML = fn();
  if(fid){ const el = document.getElementById(fid); if(el){ el.focus(); try { if(sel && sel[0] != null) el.setSelectionRange(sel[0], sel[1]); } catch(e) {} } }
}

  <div class="kpis">

    <div class="kpi"><span class="kpi-label">Preventivi aperti</span><span class="kpi-value">${eur(qVal)}</span><span class="kpi-sub">${quotes.length} da confermare</span></div>
    <div class="kpi"><span class="kpi-label">Magazzino a costo</span><span class="kpi-value">${eur(stockVal)}</span><span class="kpi-sub">${stockPcs} pezzi disponibili</span></div>
    <div class="kpi"><span class="kpi-label">Margine medio catalogo</span><span class="kpi-value">${pct(avgMargin)}</span><span class="kpi-sub">${S.products.length} modelli in ${new Set(S.products.map(p=>p.cat)).size} categorie</span></div>

/* ---------- Eventi pagina ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-open-product],[data-open-order],[data-open-custom],[data-open-supplier],[data-open-ship],[data-act],[data-new-in],[data-line],[data-ostatus],[data-go],[data-del-cat]');
  if(!t || t.closest('#sheet')) return;
  const d = t.dataset;
  if(d.openProduct) return openProduct(d.openProduct);
  if(d.openOrder) return openOrder(d.openOrder);
  if(d.openCustom) return openCustom(d.openCustom);
  if(d.openSupplier) return openSupplier(d.openSupplier);
  if(d.openShip) return openShip(d.openShip);
  if(d.newIn) return openProduct(null, d.newIn);
  if(d.line){ ui.line = d.line; return render(); }
  if(d.ostatus){ ui.orderStatus = d.ostatus; return render(); }
  if(d.go){ view = d.go; renderTabs(); return render(); }
  if(d.delCat !== undefined){ S.settings.extraCats = (S.settings.extraCats || []).filter((x,i) => i !== +d.delCat); render(); return saveSettings(); }
  switch(d.act){
    case 'new-product': return openProduct(null);
    case 'new-order': return openOrder(null);
    case 'new-custom': return openCustom(null);
    case 'new-supplier': return openSupplier(null);
    case 'new-ship': return openShip(null);
    case 'export-csv': return exportCSV();
    case 'export-json': return offerFile('tempra-backup-' + today() + '.json', JSON.stringify(S, null, 2));
    case 'clear-sample': return armThen(t, 'Conferma: elimina esempi', clearSample);
    case 'load-sample': t.disabled = true; await writeAll(sampleData()); return toast('Catalogo di esempio caricato');
    case 'start-empty': t.disabled = true; await saveSettings(); render(); return toast('Pronto: inizia dal catalogo');
    case 'add-cat': {
      const code = $('#nc-code').value.trim(), name = $('#nc-name').value.trim(), line = $('#nc-line').value;
      if(!name){ toast('Scrivi il nome della categoria'); return; }
      S.settings.extraCats = (S.settings.extraCats || []).concat({id: uid('cat'), code: code || '—', name, line});
      render(); await saveSettings(); return toast('Categoria aggiunta');
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'cat-search'){ ui.q = t.value; render(); return; }
  if(t.dataset && t.dataset.set && !t.closest('#sheet')){ S.settings[t.dataset.set] = n(t.value); clearTimeout(vSettings._t); vSettings._t = setTimeout(saveSettings, 600); }
});
document.addEventListener('change', async e => {
  if(e.target.id !== 'import-file') return;
  const file = e.target.files && e.target.files[0]; if(!file) return;
  try {
    const data = JSON.parse(await file.text());
    if(!data || typeof data !== 'object' || !COLS.some(c => Array.isArray(data[c]))) throw new Error('formato');
    const ok = await writeAll(data);
    if(ok) toast('Backup importato');
  } catch(err){ toast('File non valido: usa un backup esportato da questo gestionale.'); }
  e.target.value = '';
});
function armThen(btn, label, fn){
  if(btn.dataset.armed){ delete btn.dataset.armed; fn(); return; }
  const old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label; btn.classList.add('danger','armed');
  setTimeout(() => { if(btn.isConnected && btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = old; btn.classList.remove('armed'); } }, 4000);
}
async function clearSample(){
  for(const c of COLS){ for(const d of S[c].filter(x => x.sample)) await deleteDoc(c, d.id); }
  toast('Dati di esempio eliminati');
}

/* ---------- Export ---------- */
async function offerFile(filename, text){
  if(mode === 'cloud'){
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch(e) {}
    if(dl){
      try { await dl.save({filename, data: text}); toast('File pronto'); }
      catch(e){ if(e && e.code !== 'declined') toast('Download non disponibile qui'); }
      return;
    }
    showCopyFallback(filename, text); return;
  }
  try {
    const url = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch(e){ showCopyFallback(filename, text); }
}
function showCopyFallback(filename, text){
  if(view !== 'impostazioni'){ view = 'impostazioni'; renderTabs(); render(); }
  const box = $('#export-fallback'); if(!box) return;
  box.innerHTML = `<p class="help">Il download non è disponibile qui: copia il contenuto e salvalo come <b>${h(filename)}</b>.</p><textarea class="copybox" id="copybox" readonly>${h(text)}</textarea><button class="btn sm" id="copy-btn" style="margin-top:8px">Copia</button>`;
  $('#copy-btn').onclick = () => { const ta = $('#copybox'); navigator.clipboard?.writeText(ta.value).then(() => toast('Copiato'), () => { ta.select(); }); };
}
function exportCSV(){
  const head = ['Categoria','Codice','Linea','Modello','SKU','Grado','Colorway','Taglie/formato','Fornitore','Prezzo acquisto','Trasporto/pz','Dazi/pz','Packaging/pz','Personalizzazioni di serie/pz','Costo pieno','Prezzo vendita IVA incl.','Prezzo netto','Commissioni','Utile/pz','Margine %','Prezzo consigliato','Giacenza','Venduti','Disponibili'];
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = S.products.map(p => { const c = priceCalc(p), cat = catOf(p.cat), sold = soldQty(p.id);
    return [cat.name, cat.code, LINES[cat.line]||cat.line, p.name, p.sku, p.grade, p.colorway, p.sizes, (byId('suppliers',p.supplier)||{}).name||'', dec(c.uc.purchase), dec(c.uc.freight), dec(c.uc.duties), dec(c.uc.pack), dec(c.uc.cust), dec(c.uc.total), dec(c.price), dec(c.net), dec(c.fees), dec(c.profit), dec(c.margin*100,1), dec(c.suggested), n(p.stock), sold, n(p.stock)-sold].map(q).join(';'); });
  offerFile('tempra-catalogo-' + today() + '.csv', '﻿' + [head.join(';')].concat(lines).join('\n'));
}

/* ---------- Pannello di modifica ---------- */
function openSheet(html){
  const el = $('#sheet');
  el.innerHTML = `<div class="sheet-back" data-close></div><section class="sheet-panel" role="dialog" aria-modal="true">${html}</section>`;
  el.hidden = false; document.body.classList.add('noscroll');
  el.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
  const first = el.querySelector('.sh-body input, .sh-body select'); if(first && window.matchMedia('(min-width:900px)').matches) first.focus();
  return el.querySelector('.sheet-panel');
}
function closeSheet(){ const el = $('#sheet'); el.hidden = true; el.innerHTML = ''; document.body.classList.remove('noscroll'); }
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

function fld(label, key, val, o = {}){
  const id = 'f-' + key;
  const dis = readOnly ? 'disabled' : '';
  let ctl;
  if(o.options){
    ctl = `<select id="${id}" data-k="${key}" ${dis}>${o.options.map(([v,l]) => `<option value="${h(v)}" ${String(v)===String(val??'')?'selected':''}>${h(l)}</option>`).join('')}</select>`;
  } else if(o.area){
    ctl = `<textarea id="${id}" data-k="${key}" ${dis} placeholder="${h(o.ph||'')}">${h(val)}</textarea>`;
  } else {
    const num = o.num ? `type="number" step="any" inputmode="decimal" data-t="num"` : `type="${o.type||'text'}"`;
    ctl = `<input id="${id}" data-k="${key}" ${num} value="${h(val ?? '')}" placeholder="${h(o.ph||'')}" ${dis}>`;
  }
  return `<label class="fld ${o.cls||''}"><span>${label}</span><div class="inp">${o.pre?`<span class="affix">${o.pre}</span>`:''}${ctl}${o.suf?`<span class="affix">${o.suf}</span>`:''}</div>${o.hint?`<span class="hint">${o.hint}</span>`:''}</label>`;
}
function bindFields(panel, draft, onChange){
  const handler = e => {
    const el = e.target; const k = el.dataset && el.dataset.k; if(!k) return;
    draft[k] = el.dataset.t === 'num' ? n(el.value) : el.value;
    onChange && onChange(k, e.type);
  };
  panel.addEventListener('input', handler);
  panel.addEventListener('change', handler);
}
function footer(isNew, label){
  return `<footer class="sh-foot">${isNew ? '' : `<button class="btn danger" data-del ${readOnly?'disabled':''}>Elimina</button><button class="btn ghost" data-dup ${readOnly?'disabled':''}>Duplica</button>`}
    <span class="spacer"></span><button class="btn ghost" data-close>Annulla</button><button class="btn primary" data-save ${readOnly?'disabled':''}>${label}</button></footer>`;
}
function wireFooter(panel, {onSave, onDelete, onDup}){
  panel.querySelector('[data-save]')?.addEventListener('click', onSave);
  const del = panel.querySelector('[data-del]');
  if(del) del.addEventListener('click', () => armThen(del, 'Conferma eliminazione', onDelete));
  panel.querySelector('[data-dup]')?.addEventListener('click', onDup);
}

function openProduct(id, catId){
  const src = id ? byId('products', id) : null;
  const d = src ? clone(src) : {id: uid('p'), cat: catId || allCats()[0].id, name:'', sku:'', grade:'PRO', colorway:'Lama · Forgia', sizes:'', supplier: S.suppliers[0]?.id || '', cost:0, lotQty:50, lotShip:0, duties:0, packaging:0, baseCustoms:[], price:0, shipId: S.shipping[0]?.id || '', stock:0, reorder:5, specs:''};
  d.baseCustoms = d.baseCustoms || [];
  const catOpts = allCats().map(c => [c.id, `${c.code} ${c.name}`]);

  const shipOpts = [['','— Nessuna —']].concat(S.shipping.map(r => [r.id, `${r.name} (${eur(n(r.cost))})`]));
  const customsBox = () => {
    const list = S.customs.filter(c => !c.cats || !c.cats.length || c.cats.includes(d.cat));
    if(!list.length) return '<p class="muted" style="margin:0">Nessuna personalizzazione per questa categoria. Creane una nella sezione Personalizzazioni.</p>';

  };
  const cat = catOf(d.cat);
  const panel = openSheet(`<header class="sh-head"><div><p class="eyebrow" id="p-eyebrow">${h(cat.code)} · ${h(cat.name)}</p><h2>${src ? h(src.name || 'Modello') : 'Nuovo modello'}</h2></div><button class="icon-btn" data-close aria-label="Chiudi">✕</button></header>
  <div class="sh-body"><div class="ed-grid"><div>
    <fieldset><legend>Modello</legend><div class="fgrid">
      ${fld('Categoria','cat',d.cat,{options:catOpts, cls:'span2'})}
      ${fld('Nome modello','name',d.name,{ph:'Es. Maglia gara FC·01', cls:'span2'})}
      ${fld('SKU / codice','sku',d.sku,{ph:'TMP-FC01-LF'})}
      <label class="fld"><span>Grado di tempra</span><div class="seg" role="group" aria-label="Grado">${GRADES.map(g => `<button type="button" data-grade="${g}" aria-pressed="${d.grade===g}" ${readOnly?'disabled':''}>${g}</button>`).join('')}</div></label>
      ${fld('Colorway','colorway',d.colorway,{ph:'Lama · Forgia'})}
      ${fld('Taglie / formato','sizes',d.sizes,{ph:'XS · S · M · L · XL'})}
      ${fld('Fornitore','supplier',d.supplier,{options:supOpts, cls:'span2'})}
      ${fld('Specifiche e note','specs',d.specs,{area:true, cls:'full', ph:'Materiali, misure, dettagli tecnici'})}
    </div></fieldset>
    <fieldset><legend>Acquisto</legend><div class="fgrid">
      ${fld('Prezzo di acquisto','cost',d.cost,{num:true, suf:'€/pz', hint:'Dal fornitore, IVA esclusa'})}
      ${fld('Pezzi per lotto','lotQty',d.lotQty,{num:true, suf:'pz', hint:'Quantità ordinata (o minimo)'})}
      ${fld('Trasporto del lotto','lotShip',d.lotShip,{num:true, suf:'€', hint:'Corriere/import diviso sui pezzi'})}
      ${fld('Dazi doganali','duties',d.duties,{num:true, suf:'%', hint:'Sul prezzo di acquisto; 0 se UE'})}
      ${fld('Packaging ed etichette','packaging',d.packaging,{num:true, suf:'€/pz', hint:'Scatola, hangtag, busta'})}
    </div></fieldset>
    <fieldset><legend>Personalizzazioni di serie</legend><p class="help" style="margin:0 0 10px">Lavorazioni sempre presenti sul capo (logo TEMPRA, etichetta). Il costo d'impianto è diviso sui pezzi del lotto.</p><div id="bc-box">${customsBox()}</div></fieldset>
    <fieldset><legend>Vendita e magazzino</legend><div class="fgrid">

        <dt>Prezzo senza IVA</dt><dd>${eur(c.net)}</dd>

  });
  panel.addEventListener('click', e => {
    const g = e.target.closest('[data-grade]'); if(!g) return;
    d.grade = g.dataset.grade; panel.querySelectorAll('[data-grade]').forEach(b => b.setAttribute('aria-pressed', b.dataset.grade === d.grade));
  });
  sum();
  wireFooter(panel, {
    onSave: async () => { if(!d.name.trim()){ toast('Dai un nome al modello'); $('#f-name').focus(); return; } delete d.sample; closeSheet(); if(await saveDoc('products', d)) toast('Modello salvato'); },
    onDelete: async () => { closeSheet(); await deleteDoc('products', d.id); toast('Modello eliminato'); },
    onDup: () => { const c = clone(d); c.id = uid('p'); c.name = d.name + ' (copia)'; c.stock = 0; delete c.sample; closeSheet(); saveDoc('products', c).then(ok => { if(ok){ toast('Copia creata'); openProduct(c.id); } }); }
  });
}

/* ----- Personalizzazione ----- */
function openCustom(id){
  const src = id ? byId('customs', id) : null;
  const d = src ? clone(src) : {id: uid('c'), name:'', method: METHODS[0], cost:0, setup:0, price:0, cats:[], notes:''};
  d.cats = d.cats || [];
  const catChecks = ['calcio','padel'].map(l => `<p class="eyebrow" style="margin:10px 0 6px">${LINES[l]}</p><div class="checks">${allCats().filter(c=>c.line===l).map(c => `<label class="check"><input type="checkbox" data-cc="${h(c.id)}" ${d.cats.includes(c.id)?'checked':''} ${readOnly?'disabled':''}><span>${h(c.code)} ${h(c.name)}</span></label>`).join('')}</div>`).join('');
  const panel = openSheet(`<header class="sh-head"><div><p class="eyebrow">Personalizzazione</p><h2>${src ? h(src.name) : 'Nuova personalizzazione'}</h2></div><button class="icon-btn" data-close aria-label="Chiudi">✕</button></header>
  <div class="sh-body"><div class="ed-grid"><div>
    <fieldset><legend>Lavorazione</legend><div class="fgrid">
      ${fld('Nome','name',d.name,{ph:'Es. Numero sul retro', cls:'span2'})}
      ${fld('Tecnica','method',d.method,{options:METHODS.map(m=>[m,m])})}
      ${fld('Costo per pezzo','cost',d.cost,{num:true, suf:'€/pz', hint:'Quanto la paghi al laboratorio'})}
      ${fld('Costo impianto','setup',d.setup,{num:true, suf:'€', hint:'Una tantum: cliché, punch, telaio'})}
      ${fld('Prezzo al cliente','price',d.price,{num:true, suf:'€/pz IVA incl.', hint:'0 = inclusa di serie nel prodotto'})}
      ${fld('Note','notes',d.notes,{area:true, cls:'full'})}
    </div></fieldset>
    <fieldset><legend>Su quali prodotti</legend><p class="help" style="margin:0">Nessuna selezione = disponibile per tutte le categorie.</p>${catChecks}</fieldset>
  </div><aside class="ed-sum" id="c-sum"></aside></div></div>
  ${footer(!src, src ? 'Salva modifiche' : 'Crea personalizzazione')}`);
  const sum = () => {
    const v = n(S.settings.iva)/100, net = n(d.price)/(1+v), m = net - n(d.cost);
    const be = n(d.setup) > 0 && m > 0 ? Math.ceil(n(d.setup)/m) : null;
    $('#c-sum').innerHTML = `<div class="sum"><p class="eyebrow">Resa</p><div class="sum-big">${n(d.price) ? eur(n(d.price)) : 'Di serie'}<small>${n(d.price) ? 'al cliente' : 'costo nel prodotto'}</small></div>
    <dl><dt>Prezzo senza IVA</dt><dd>${eur(net)}</dd><dt>Costo per pezzo</dt><dd>${eur(n(d.cost))}</dd><dt class="tot">Guadagno per pezzo</dt><dd class="tot ${m<0?'neg':'pos'}">${eur(m)}</dd>
    <dt>Impianto</dt><dd>${eur(n(d.setup))}</dd></dl>
    <div class="sum-note">${n(d.price) ? (be ? `<span>L'impianto si ripaga dopo <b>${be} pezzi</b>.</span>` : (n(d.setup) ? '<span>Con questo prezzo l\'impianto non si ripaga mai.</span>' : '<span>Nessun impianto da ammortizzare.</span>')) : '<span>Seleziona questa lavorazione nei modelli come "di serie": il costo verrà sommato al costo pieno.</span>'}</div></div>`;
  };
  bindFields(panel, d, sum);
  panel.addEventListener('change', e => { const cc = e.target.dataset && e.target.dataset.cc; if(!cc) return; d.cats = e.target.checked ? [...new Set(d.cats.concat(cc))] : d.cats.filter(x => x !== cc); });
  sum();
  wireFooter(panel, {
    onSave: async () => { if(!d.name.trim()){ toast('Dai un nome alla personalizzazione'); return; } delete d.sample; closeSheet(); if(await saveDoc('customs', d)) toast('Personalizzazione salvata'); },
    onDelete: async () => { closeSheet(); await deleteDoc('customs', d.id); toast('Personalizzazione eliminata'); },
    onDup: () => { const c = clone(d); c.id = uid('c'); c.name += ' (copia)'; delete c.sample; closeSheet(); saveDoc('customs', c).then(ok => ok && openCustom(c.id)); }
  });
}

/* ----- Fornitore ----- */
function openSupplier(id){
  const src = id ? byId('suppliers', id) : null;
  const d = src ? clone(src) : {id: uid('f'), name:'', country:'', contact:'', email:'', phone:'', website:'', leadDays:0, moq:0, terms:'', notes:''};
  const prods = S.products.filter(p => p.supplier === d.id);
  const panel = openSheet(`<header class="sh-head"><div><p class="eyebrow">Fornitore</p><h2>${src ? h(src.name) : 'Nuovo fornitore'}</h2></div><button class="icon-btn" data-close aria-label="Chiudi">✕</button></header>
  <div class="sh-body"><div class="ed-grid"><div>
    <fieldset><legend>Anagrafica</legend><div class="fgrid">
      ${fld('Ragione sociale','name',d.name,{cls:'span2'})}
      ${fld('Paese','country',d.country)}
      ${fld('Referente','contact',d.contact)}
      ${fld('Email','email',d.email,{type:'email'})}
      ${fld('Telefono / WhatsApp','phone',d.phone,{type:'tel'})}
      ${fld('Sito o catalogo','website',d.website,{cls:'span2'})}
    </div></fieldset>
    <fieldset><legend>Condizioni</legend><div class="fgrid">
      ${fld('Tempo di consegna','leadDays',d.leadDays,{num:true, suf:'giorni'})}
      ${fld('Ordine minimo','moq',d.moq,{num:true, suf:'pz'})}
      ${fld('Pagamento','terms',d.terms,{cls:'span2', ph:'Es. 30% anticipo, saldo alla spedizione'})}
      ${fld('Note','notes',d.notes,{area:true, cls:'full'})}
    </div></fieldset>
  </div><aside class="ed-sum"><div class="sum"><p class="eyebrow">Modelli collegati</p><div class="sum-big">${prods.length}<small>${prods.length===1?'modello':'modelli'}</small></div>
    <dl>${prods.map(p => `<dt>${h(p.name)}</dt><dd>${eur(n(p.cost))}</dd>`).join('') || '<dt>Nessuno</dt><dd></dd>'}</dl>
    <div class="sum-note"><span>Per collegare un modello apri la sua scheda nel Catalogo e scegli questo fornitore.</span></div></div></aside></div></div>
  ${footer(!src, src ? 'Salva modifiche' : 'Crea fornitore')}`);

  wireFooter(panel, {
    onSave: async () => { if(!d.name.trim()){ toast('Scrivi il nome del fornitore'); return; } delete d.sample; closeSheet(); if(await saveDoc('suppliers', d)) toast('Fornitore salvato'); },
    onDelete: async () => { closeSheet(); await deleteDoc('suppliers', d.id); toast('Fornitore eliminato'); },
    onDup: () => { const c = clone(d); c.id = uid('f'); c.name += ' (copia)'; delete c.sample; closeSheet(); saveDoc('suppliers', c).then(ok => ok && openSupplier(c.id)); }
  });
}

/* ----- Spedizione ----- */
function openShip(id){
  const src = id ? byId('shipping', id) : null;
  const d = src ? clone(src) : {id: uid('s'), name:'', carrier:'', zone:'Italia', maxKg:0, cost:0, price:0, notes:''};
  const panel = openSheet(`<header class="sh-head"><div><p class="eyebrow">Tariffa di spedizione</p><h2>${src ? h(src.name) : 'Nuova tariffa'}</h2></div><button class="icon-btn" data-close aria-label="Chiudi">✕</button></header>
  <div class="sh-body"><div class="ed-grid"><div><fieldset><legend>Tariffa</legend><div class="fgrid">
    ${fld('Nome','name',d.name,{cls:'span2', ph:'Es. Italia · pacco medio'})}
    ${fld('Corriere','carrier',d.carrier)}
    ${fld('Zona','zone',d.zone,{options:[['Italia','Italia'],['UE','UE'],['Extra UE','Extra UE'],['Locale','Locale']]})}
    ${fld('Peso massimo','maxKg',d.maxKg,{num:true, suf:'kg'})}
    ${fld('Costo corriere','cost',d.cost,{num:true, suf:'€', hint:'Quanto paghi tu, IVA esclusa'})}
    ${fld('Prezzo al cliente','price',d.price,{num:true, suf:'€ IVA incl.'})}
    ${fld('Note','notes',d.notes,{area:true, cls:'full'})}
  </div></fieldset></div><aside class="ed-sum" id="s-sum"></aside></div></div>
  ${footer(!src, src ? 'Salva modifiche' : 'Crea tariffa')}`);
  const sum = () => { const v = n(S.settings.iva)/100, diff = n(d.price)/(1+v) - n(d.cost);
    $('#s-sum').innerHTML = `<div class="sum"><p class="eyebrow">Per spedizione</p><div class="sum-big">${eur(diff)}<small>${diff < 0 ? 'a tuo carico' : 'di differenza'}</small></div>
    <dl><dt>Pagato dal cliente (senza IVA)</dt><dd>${eur(n(d.price)/(1+v))}</dd><dt>Costo corriere</dt><dd>${eur(n(d.cost))}</dd><dt class="tot">Se gratuita per il cliente</dt><dd class="tot neg">${eur(-n(d.cost))}</dd></dl></div>`; };
  bindFields(panel, d, sum); sum();
  wireFooter(panel, {
    onSave: async () => { if(!d.name.trim()){ toast('Dai un nome alla tariffa'); return; } delete d.sample; closeSheet(); if(await saveDoc('shipping', d)) toast('Tariffa salvata'); },
    onDelete: async () => { closeSheet(); await deleteDoc('shipping', d.id); toast('Tariffa eliminata'); },
    onDup: () => { const c = clone(d); c.id = uid('s'); c.name += ' (copia)'; delete c.sample; closeSheet(); saveDoc('shipping', c).then(ok => ok && openShip(c.id)); }
  });
}

/* ----- Ordine / preventivo ----- */
function nextNumber(){
  const max = S.orders.reduce((m,o) => Math.max(m, parseInt(String(o.number||'').replace(/\D/g,''),10) || 0), 0);
  return 'TMP-' + String(max + 1).padStart(4,'0');
}
function openOrder(id){
  const src = id ? byId('orders', id) : null;
  const d = src ? clone(src) : {id: uid('o'), number: nextNumber(), date: today(), customer:'', channel:'Squadra', status:'Preventivo', shipId: S.shipping[0]?.id || '', parcels:1, shipCharged: n(S.shipping[0]?.price), discountPct:0, notes:'', items:[]};
  d.items = d.items || [];
  if(!src && S.products[0]) d.items.push({pid: S.products[0].id, qty: 1, price: n(S.products[0].price), customs: []});
  const prodOpts = () => allCats().map(c => { const ps = S.products.filter(p => p.cat === c.id); return ps.length ? `<optgroup label="${h(c.code)} ${h(c.name)}">${ps.map(p => `<option value="${h(p.id)}">${h(p.name)} · ${eur(n(p.price))}</option>`).join('')}</optgroup>` : ''; }).join('');
  const linesHtml = () => d.items.map((it, i) => {
    const p = byId('products', it.pid); const cat = p ? p.cat : null;
    const cs = S.customs.filter(c => n(c.price) > 0 && (!c.cats || !c.cats.length || c.cats.includes(cat)));
    return `<div class="ol"><label class="fld ol-prod"><span>Modello</span><div class="inp"><select data-li="${i}" data-lk="pid" ${readOnly?'disabled':''}>${p ? '' : '<option value="">— scegli —</option>'}${prodOpts().replace(`value="${h(it.pid)}"`, `value="${h(it.pid)}" selected`)}</select></div></label>
      <label class="fld"><span>Pezzi</span><div class="inp"><input type="number" step="1" min="0" inputmode="numeric" data-li="${i}" data-lk="qty" value="${n(it.qty)}" ${readOnly?'disabled':''}></div></label>
      <label class="fld"><span>Prezzo/pz</span><div class="inp"><input type="number" step="any" inputmode="decimal" data-li="${i}" data-lk="price" value="${n(it.price)}" ${readOnly?'disabled':''}><span class="affix">€</span></div></label>
      <div class="ol-tot num" id="ol-tot-${i}"></div>
      <button class="icon-btn" data-rm="${i}" aria-label="Rimuovi riga" ${readOnly?'disabled':''}>✕</button>
      <div class="ol-cust">${cs.length ? `<div class="mini-checks">${cs.map(c => `<label><input type="checkbox" data-li="${i}" data-lc="${h(c.id)}" ${(it.customs||[]).includes(c.id)?'checked':''} ${readOnly?'disabled':''}>${h(c.name)} <span class="muted num">+${eur(n(c.price))}</span></label>`).join('')}</div>` : '<span class="muted" style="font-size:12.5px">Nessuna personalizzazione a pagamento per questo modello.</span>'}</div></div>`;
  }).join('') || '<p class="muted" style="margin:0">Aggiungi almeno un modello.</p>';
  const shipOpts = [['','— Nessuna —']].concat(S.shipping.map(r => [r.id, `${r.name} · ${eur(n(r.price))} al cliente`]));
  const panel = openSheet(`<header class="sh-head"><div><p class="eyebrow mono">${h(d.number)}</p><h2>${src ? (d.status === 'Preventivo' ? 'Preventivo' : 'Ordine') + ' ' + h(d.customer || '') : 'Nuovo preventivo'}</h2></div><button class="icon-btn" data-close aria-label="Chiudi">✕</button></header>
  <div class="sh-body"><div class="ed-grid"><div>
    <fieldset><legend>Cliente</legend><div class="fgrid">
      ${fld('Cliente / squadra','customer',d.customer,{cls:'span2', ph:'Es. ASD Nome squadra'})}
      ${fld('Data','date',d.date,{type:'date'})}
      ${fld('Canale','channel',d.channel,{options:CHANNELS.map(c=>[c,c])})}
      ${fld('Stato','status',d.status,{options:STATUSES.map(s=>[s,s])})}
    </div></fieldset>
    <fieldset><legend>Articoli</legend><div id="ol-box">${linesHtml()}</div>
      <div class="actions" style="margin-top:12px"><button class="btn sm" data-add-line ${readOnly?'disabled':''}>+ Aggiungi modello</button></div>
      <p class="help">Prezzo per pezzo IVA inclusa, già scontato se fai un prezzo squadra. Le personalizzazioni spuntate si applicano a tutti i pezzi della riga; l'impianto viene conteggiato una volta.</p></fieldset>
    <fieldset><legend>Spedizione e sconto</legend><div class="fgrid">
      ${fld('Tariffa','shipId',d.shipId,{options:shipOpts, cls:'span2'})}
      ${fld('Colli','parcels',d.parcels,{num:true, suf:'n.'})}
      ${fld('Spedizione addebitata','shipCharged',d.shipCharged,{num:true, suf:'€', hint:'Quanto paga il cliente'})}
      ${fld('Sconto','discountPct',d.discountPct,{num:true, suf:'%', hint:'Sulla merce'})}
      ${fld('Note','notes',d.notes,{area:true, cls:'full'})}
    </div></fieldset>
  </div><aside class="ed-sum" id="o-sum"></aside></div></div>
  ${footer(!src, src ? 'Salva modifiche' : 'Crea preventivo')}`);
  const sum = () => {
    const c = orderCalc(d);
    c.lines.forEach((l, i) => { const el = $('#ol-tot-' + i); if(el) el.innerHTML = `<small>${eur(l.unitFull)}/pz</small>${eur(l.gross)}`; });
    const free = n(S.settings.freeShipOver) > 0 && (c.sub - c.discount) >= n(S.settings.freeShipOver);
    $('#o-sum').innerHTML = `<div class="sum"><p class="eyebrow">Riepilogo</p><div class="sum-big">${eur(c.total)}<small>totale cliente</small></div>
      <span class="pill ${c.profit<0?'bad':(c.margin < n(S.settings.targetMargin)/100 ? 'warn':'ok')}">Margine ${pct(c.margin)}</span>
      <dl><dt class="sub-h">Cliente paga</dt>
        <dt>Merce</dt><dd>${eur(c.goods)}</dd><dt>Personalizzazioni</dt><dd>${eur(c.custGross)}</dd>
        ${c.discount ? `<dt>Sconto ${dec(n(d.discountPct),1)}%</dt><dd>−${eur(c.discount)}</dd>` : ''}
        <dt>Spedizione</dt><dd>${eur(c.shipCharged)}</dd>
        <dt class="tot">Totale IVA incl.</dt><dd class="tot">${eur(c.total)}</dd>
        <dt>di cui IVA</dt><dd>${eur(c.vat)}</dd><dt>Imponibile</dt><dd>${eur(c.net)}</dd>
        <dt class="sub-h">Tuoi costi</dt>
        <dt>Merce (costo pieno)</dt><dd>${eur(c.goodsCost)}</dd><dt>Personalizzazioni + impianti</dt><dd>${eur(c.custCost)}</dd>
        <dt>Corriere</dt><dd>${eur(c.shipCost)}</dd><dt>Commissioni pagamento</dt><dd>${eur(c.fees)}</dd>
        <dt class="tot">Utile netto</dt><dd class="tot ${c.profit<0?'neg':'pos'}">${eur(c.profit)}</dd></dl>
      <div class="sum-note"><span>${c.pieces} pezzi · media <b>${eur(c.pieces ? c.total / c.pieces : NaN)}</b> a pezzo per il cliente.</span>
      ${free ? `<span>Sopra la soglia di ${eur(n(S.settings.freeShipOver))}: puoi offrire la spedizione gratis.</span>` : ''}</div></div>`;
  };
  const redrawLines = () => { $('#ol-box').innerHTML = linesHtml(); sum(); };
  bindFields(panel, d, (k) => {
    if(k === 'shipId'){ const r = byId('shipping', d.shipId); const c = orderCalc(d); const free = n(S.settings.freeShipOver) > 0 && (c.sub - c.discount) >= n(S.settings.freeShipOver);
      d.shipCharged = r && !free ? n(r.price) : 0; $('#f-shipCharged').value = d.shipCharged; }
    sum();
  });
  const lineHandler = e => {
    const el = e.target; if(!el.dataset || el.dataset.li === undefined) return;
    const it = d.items[+el.dataset.li]; if(!it) return;
    if(el.dataset.lc){ if(e.type !== 'change') return; it.customs = el.checked ? [...new Set((it.customs||[]).concat(el.dataset.lc))] : (it.customs||[]).filter(x => x !== el.dataset.lc); sum(); return; }
    const k = el.dataset.lk;
    if(k === 'pid'){ if(e.type !== 'change') return; it.pid = el.value; const p = byId('products', it.pid); it.price = p ? n(p.price) : 0; it.customs = []; redrawLines(); return; }
    it[k] = n(el.value); sum();
  };
  panel.addEventListener('input', lineHandler);
  panel.addEventListener('change', lineHandler);
  panel.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]'); if(rm){ d.items.splice(+rm.dataset.rm, 1); redrawLines(); return; }
    if(e.target.closest('[data-add-line]')){ const p = S.products[0]; d.items.push({pid: p ? p.id : '', qty: 1, price: p ? n(p.price) : 0, customs: []}); redrawLines(); }
  });
  sum();
  wireFooter(panel, {
    onSave: async () => { if(!d.customer.trim()){ toast('Scrivi il nome del cliente'); $('#f-customer').focus(); return; } d.items = d.items.filter(it => it.pid); delete d.sample; closeSheet(); if(await saveDoc('orders', d)) toast(d.status === 'Preventivo' ? 'Preventivo salvato' : 'Ordine salvato'); },
    onDelete: async () => { closeSheet(); await deleteDoc('orders', d.id); toast('Eliminato'); },
    onDup: () => { const c = clone(d); c.id = uid('o'); c.number = nextNumber(); c.date = today(); c.status = 'Preventivo'; delete c.sample; closeSheet(); saveDoc('orders', c).then(ok => { if(ok){ toast('Duplicato come nuovo preventivo'); openOrder(c.id); } }); }
  });
}

boot();
</script>
